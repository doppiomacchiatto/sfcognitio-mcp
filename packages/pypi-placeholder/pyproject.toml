[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sfcognitio-mcp"
version = "0.0.1"
description = "SfCognitio: Salesforce documentation knowledge server (MCP) that makes any agent a Salesforce expert. Placeholder release."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Santisi LLC" }]
requires-python = ">=3.10"
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Homepage = "https://github.com/doppiomacchiatto/sfcognitio-mcp"
