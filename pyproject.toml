[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sfcognitio-mcp"
version = "0.1.0.dev0"
description = "SfCognitio: Salesforce documentation knowledge server (MCP) that lets any agent become a Salesforce expert."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Santisi LLC" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "markdownify>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
sfcognitio = "sfcognitio_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/doppiomacchiatto/sfcognitio-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/sfcognitio_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
