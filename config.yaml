# SfCognitio crawler configuration.
# Paths are relative to this file.

data_dir: ./data

crawler:
  # developer.salesforce.com returns 403 to anonymous agents.
  # Keep a descriptive, honest user agent with a contact URL.
  user_agent: "sfcognitio-mcp/0.1 (+https://github.com/doppiomacchiatto/sfcognitio-mcp) python-httpx"
  concurrency: 2
  per_host_delay_seconds: 2.5
  timeout_seconds: 60
  max_retries: 4
  # On repeated 403/429, stop the run and resume later instead of hammering.
  max_backoff_seconds: 300
  # Re-check pages older than this on later runs (conditional GET).
  recheck_after_days: 14
  # 0 = no limit. Use --limit on the CLI for trial runs.
  max_pages: 0
  # Reuse a fully-read sitemap URL list for this many hours (0 = always re-fetch).
  # The docs sitemap tree takes several minutes to walk, so avoid re-walking it.
  sitemap_cache_hours: 24

# Guides to crawl (the allow-list). Override with --guide. Ids are the guide
# segment in the docs URL. Which source each one uses (classic atlas or the
# newer docs site) comes from the llms lists under sources.llms.
# On hold, not listed yet: Platform subset (rest of llms-platform), Service
# Cloud, spiff. See HANDOFF.md.
guides:
  # Classic atlas
  - apexcode          # Apex Developer Guide
  - apexref           # Apex Reference Guide
  - api_meta          # Metadata API Developer Guide
  - object_reference  # Object Reference
  - api_tooling       # Tooling API
  - uiapi             # User Interface API
  - bi_dev_guide_rest # CRM Analytics REST API
  # Newer docs site
  - api-rest          # REST API Developer Guide
  - api               # SOAP API Developer Guide
  - api-asynch        # Bulk API 2.0 and Bulk API Developer Guide
  - platform-events   # Platform Events Developer Guide
  - field-reference   # Platform field reference
  - connect-rest-api  # Connect REST API
  - graphql           # GraphQL API
  - pub-sub-api       # Pub/Sub API
  - lwc               # Lightning Web Components Developer Guide
  - lightning-components-security
  - utam
  - slds-linter
  - slds-validator
  - lightning-component-reference  # Lightning base components
  - hosted-mcp-servers # Hosted MCP Servers (incl. Headless 360)

# Hand-picked pages to crawl in addition to the guides. They land in the
# "articles" bucket (data/text/articles/). Newer-docs-site URLs (.md) work best.
extra_pages:
  - https://developer.salesforce.com/docs/platform/connect-rest-api/guide/intro_what_is_chatter_connect.md
  - https://developer.salesforce.com/docs/platform/graphql/guide/graphql-about.md
  - https://developer.salesforce.com/docs/platform/api-streaming/guide/intro-stream.md

sources:
  llms:
    enabled: true
    base: https://developer.salesforce.com/docs
    # Product lists to read, each fetched from <base>/llms-<name>.txt and cached
    # in data/llms/. Only guides in the allow-list above are taken from them.
    files:
      - product-docs
      - platform
      - platform-field-ref
      - lwc
      - lightning-base-components
      - connect-rest
      - graphql-api
      - event-bus
      - hosted-mcp-servers
  atlas:
    enabled: true
    # Classic guides. Discovery uses each guide's table of contents API,
    # falling back to this sitemap.
    sitemap: https://developer.salesforce.com/docs-atlas-sitemap.xml
    base: https://developer.salesforce.com/docs
    locale: en-us
    # Which Salesforce release to crawl. "latest" lets each guide use its own
    # newest version (they can differ). Pin one release so every guide matches:
    #   release: "Winter '27"    (or API version "68.0", or doc release "264.0")
    release: "Winter '27"
    # If a guide isn't published for the pinned release:
    #   false = fall back to that guide's latest, true = skip the guide.
    strict_release: false
  docs:
    enabled: true
    # Newer statically generated docs (LWC, Platform, etc.).
    sitemap: https://developer.salesforce.com/docs/ssg-sitemap.xml
    include: ["https://developer.salesforce.com/docs/"]
    exclude: ["/ja-jp/", "/fr-fr/", "/de-de/", "/es-es/", "/it-it/", "/ko-kr/",
              "/zh-cn/", "/zh-tw/", "/pt-br/", "/nl-nl/", "/es-mx/"]
